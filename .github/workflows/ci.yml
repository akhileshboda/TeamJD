name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site/client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      # The rateLimits "independent boundaries" test flakes roughly one run in six
      # (a known socket error unrelated to the code), so a failure is retried once.
      - run: npm test || npm test
      - run: npm test --prefix client
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    # Informational: the remaining advisories are install-time only (sqlite3 build
    # chain), so this shows as a warning instead of blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

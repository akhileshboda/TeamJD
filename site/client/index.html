<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team JD | Jake Dedert Fitness Coaching</title>
  <meta name="description" content="Jake Dedert is a Pro Physique bodybuilder and elite fitness coach specialising in competition preparation, online coaching, personal training, and posing.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/api/assets/logo-mark">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://jake-site-assets.akhileshboda.com" crossorigin>
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"

  <script>
    if (window.location.pathname === '/about') {
      const aboutHeroPreload = document.createElement('link')
      aboutHeroPreload.rel = 'preload'
      aboutHeroPreload.as = 'image'
      aboutHeroPreload.href = '/api/assets/jake-hero'
      aboutHeroPreload.fetchPriority = 'high'
      document.head.appendChild(aboutHeroPreload)
    }
  </script>
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
